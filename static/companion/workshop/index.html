<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N.E.K.O. Companion Workshop</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 24px;
      background: #0f1220;
      color: #e8eaf6;
    }
    h1 { font-size: 1.4rem; }
    .empty { color: #9aa0c3; margin-top: 24px; }
    ul { list-style: none; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .card {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.04);
    }
    .cover { width: 100%; height: 140px; object-fit: cover; display: block; }
    .cover.placeholder { background: linear-gradient(135deg, #2a2f4a, #1a1d30); height: 140px; }
    .body { padding: 12px 14px; }
    .meta { font-size: 0.8rem; color: #9aa0c3; margin-top: 8px; }
    .summary { font-size: 0.85rem; color: #c5c9e0; margin: 8px 0 0; line-height: 1.4; max-height: 3.2em; overflow: hidden; }
    .tag { display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; background: rgba(124,108,255,0.2); margin-right: 6px; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Companion Workshop</h1>
  </header>
  <ul id="catalog"></ul>
  <p id="empty" class="empty" hidden></p>
  <script src="/static/companion/i18n.js"></script>
  <script src="/static/companion/workshop/workshop.js"></script>
</body>
</html>
